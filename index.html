<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>揮手 GIF 產生器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">PETWAVE / GIF MAKER</div>
        <h1>揮手 GIF 產生器</h1>
        <p>上傳圖片 → 放上揮手手掌 → 拖動位置與尺寸 → 加文字 → 匯出 GIF</p>
      </div>
      <a class="ref-link" href="https://benisland.neocities.org/petpet/" target="_blank" rel="noreferrer">參考 Petpet ↗</a>
    </header>

    <main class="layout">
      <aside class="panel controls">
        <section class="control-section">
          <h2>① 圖片</h2>
          <label class="dropzone" id="imageDropzone">
            <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
            <span class="drop-icon">↑</span>
            <strong id="imageFileLabel">點擊或拖曳圖片到這裡</strong>
            <small>PNG / JPG / WEBP / GIF</small>
          </label>
          <div class="field-grid">
            <label>圖片尺寸 <output id="imageSizeValue">100%</output>
              <input id="imageSize" type="range" min="20" max="140" value="100">
            </label>
            <label>圖片透明度 <output id="imageOpacityValue">100%</output>
              <input id="imageOpacity" type="range" min="0" max="100" value="100">
            </label>
          </div>
          <div class="button-row">
            <button class="ghost" id="resetImageBtn" type="button">重設圖片</button>
          </div>
        </section>

        <section class="control-section">
          <h2>② 揮手素材</h2>
          <label class="dropzone compact">
            <input id="handInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
            <strong>更換手掌素材</strong>
            <small>預設使用 assets/hand.gif</small>
          </label>
          <div class="field-grid">
            <label>手掌尺寸 <output id="handSizeValue">100%</output>
              <input id="handSize" type="range" min="20" max="180" value="100">
            </label>
            <label>手掌透明度 <output id="handOpacityValue">100%</output>
              <input id="handOpacity" type="range" min="0" max="100" value="100">
            </label>
          </div>
          <div class="button-row">
            <button class="ghost" id="resetHandBtn" type="button">重設手掌</button>
          </div>
        </section>

        <section class="control-section">
          <h2>③ 文字</h2>
          <textarea id="textInput" rows="2" placeholder="輸入文字，例如：嗨！&#10;今天也要加油～">嗨！</textarea>
          <div class="field-grid">
            <label>字體大小 <output id="fontSizeValue">42</output>
              <input id="fontSize" type="range" min="16" max="96" value="42">
            </label>
            <label>粗細 <output id="fontWeightValue">700</output>
              <input id="fontWeight" type="range" min="400" max="900" step="100" value="700">
            </label>
          </div>
          <div class="field-grid two">
            <label>文字色
              <input id="textColor" type="color" value="#ffffff">
            </label>
            <label>外框色
              <input id="strokeColor" type="color" value="#111111">
            </label>
          </div>
          <button class="ghost full" id="resetTextBtn" type="button">重設文字位置</button>
        </section>

        <section class="control-section">
          <h2>④ 動畫</h2>
          <div class="field-grid">
            <label>揮手速度 <output id="fpsValue">12 FPS</output>
              <input id="fps" type="range" min="4" max="24" value="12">
            </label>
            <label>揮手幅度 <output id="waveValue">18°</output>
              <input id="wave" type="range" min="4" max="34" value="18">
            </label>
          </div>
          <div class="field-grid two">
            <label>輸出尺寸 <output id="outputSizeValue">400 × 400</output>
              <input id="outputSize" type="range" min="240" max="720" step="20" value="400">
            </label>
            <label>背景
              <select id="background">
                <option value="transparent" selected>透明</option>
                <option value="#ffffff">白色</option>
                <option value="#000000">黑色</option>
              </select>
            </label>
          </div>
        </section>

        <section class="control-section tips">
          <h2>拖動方式</h2>
          <p>直接拖曳預覽中的圖片、手掌或文字即可移動位置。</p>
          <div class="layer-buttons">
            <button data-layer="subject" class="layer active" type="button">圖片</button>
            <button data-layer="hand" class="layer" type="button">手掌</button>
            <button data-layer="text" class="layer" type="button">文字</button>
          </div>
        </section>
      </aside>

      <section class="workspace">
        <div class="preview-card">
          <div class="preview-head">
            <div>
              <span class="status-dot"></span>
              <span id="statusText">預覽中</span>
            </div>
            <div class="frame-count" id="frameCount">12 frames</div>
          </div>
          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="previewCanvas" width="400" height="400" aria-label="GIF 預覽"></canvas>
            <div class="empty-overlay" id="emptyOverlay">
              <div class="empty-icon">✦</div>
              <strong>先上傳一張圖片</strong>
              <span>圖片會留在你的瀏覽器內處理</span>
            </div>
          </div>
          <div class="preview-footer">
            <div class="play-controls">
              <button id="playToggle" class="icon-btn" type="button" aria-label="播放或暫停">❚❚</button>
              <span id="activeLayerLabel">目前：圖片</span>
            </div>
            <button class="export-btn" id="exportBtn" type="button">匯出 GIF</button>
          </div>
          <div class="progress-area" id="progressArea" hidden>
            <div class="progress-track"><span id="progressBar"></span></div>
            <span id="progressText">準備中…</span>
          </div>
          <div class="result-area" id="resultArea" hidden>
            <img id="resultImage" alt="匯出的 GIF 預覽">
            <a id="downloadLink" class="download-btn" download="petwave.gif">下載 GIF</a>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <span>Petwave GIF Maker</span>
      <span>GitHub Pages ready · 無需後端</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
